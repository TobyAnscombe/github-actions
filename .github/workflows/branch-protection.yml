###############################################################################
# Reusable branch protection workflow
#
# Applies standard protection rules to a branch — blocking force pushes and
# deletions and optionally requiring status checks to pass before merging.
#
# Call this after all CI jobs pass on pushes to the default branch so that
# the required-checks list is kept in sync with the active CI jobs.
#
# Usage:
#
#   jobs:
#     protect-main:
#       if: github.ref == 'refs/heads/main' && github.event_name == 'push'
#       needs: [job-a, job-b]
#       uses: TobyAnscombe/github-actions/.github/workflows/branch-protection.yml@main
#       with:
#         required_checks: '["job-a / Sub-job name", "job-b / Sub-job name"]'
###############################################################################

on:
  workflow_call:
    inputs:
      branch:
        description: "Branch to protect"
        type: string
        default: "main"
      required_checks:
        description: >
          JSON array of required status check context names — for reusable
          workflow calls use "{calling-job-id} / {callee-job-name}" format.
          Example: '["secret-scan / Scan for secrets", "ansible-lint / Lint Ansible"]'
        type: string
        default: "[]"

jobs:
  protect-branch:
    name: Protect branch
    runs-on: ubuntu-latest

    steps:
      - name: Apply branch protection rules
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
        run: |
          CHECKS='${{ inputs.required_checks }}'

          if [ "$CHECKS" = "[]" ] || [ -z "$CHECKS" ]; then
            STATUS_CHECKS="null"
          else
            STATUS_CHECKS=$(jq -n --argjson c "$CHECKS" \
              '{"strict": false, "contexts": $c}')
          fi

          PAYLOAD=$(jq -n \
            --argjson sc "$STATUS_CHECKS" \
            '{
              required_status_checks: $sc,
              enforce_admins: false,
              required_pull_request_reviews: null,
              restrictions: null,
              allow_force_pushes: false,
              allow_deletions: false
            }')

          gh api "repos/$REPO/branches/$BRANCH/protection" \
            --method PUT \
            --input - <<< "$PAYLOAD"
