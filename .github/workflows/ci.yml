name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    uses: ./.github/workflows/gitleaks.yml
    permissions:
      security-events: write

  protect-main:
    if: github.event_name == 'push'
    needs: [secret-scan]
    uses: ./.github/workflows/branch-protection.yml
    secrets:
      token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
    with:
      required_checks: '["secret-scan / Scan for secrets"]'
