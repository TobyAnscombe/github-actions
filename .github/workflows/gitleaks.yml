###############################################################################
# Reusable Gitleaks secret scanning workflow
#
# Scans the full git history for secrets and uploads results to the GitHub
# Security tab as SARIF.  The job uses continue-on-error so SARIF is always
# uploaded, even when leaks are found, and then fails the workflow explicitly.
#
# Usage from any project:
#
#   jobs:
#     secret-scan:
#       uses: TobyAnscombe/github-actions/.github/workflows/gitleaks.yml@main
#
# Optional — only needed if the repo has a custom .gitleaks.toml:
#
#   jobs:
#     secret-scan:
#       uses: TobyAnscombe/github-actions/.github/workflows/gitleaks.yml@main
#       with:
#         gitleaks_config: ".gitleaks.toml"
###############################################################################

on:
  workflow_call:
    inputs:
      gitleaks_version:
        description: "Gitleaks version to install (pin explicitly to avoid supply-chain risk)"
        type: string
        default: "v8.30.1"
      gitleaks_config:
        description: >
          Path to a .gitleaks.toml config file relative to the repo root.
          Leave empty (default) to use gitleaks built-in rules.
        type: string
        default: ""

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so gitleaks can scan all commits

      - name: Install gitleaks
        env:
          VERSION: ${{ inputs.gitleaks_version }}
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        id: gitleaks
        run: |
          CONFIG_ARG=""
          if [ -n "${{ inputs.gitleaks_config }}" ] && [ -f "${{ inputs.gitleaks_config }}" ]; then
            CONFIG_ARG="--config ${{ inputs.gitleaks_config }}"
          fi
          gitleaks detect \
            $CONFIG_ARG \
            --report-format sarif \
            --report-path gitleaks-results.sarif \
            --redact \
            --exit-code 1
        continue-on-error: true  # upload results even when leaks are found

      - name: Create empty SARIF if no findings
        if: always()
        run: |
          if [ ! -f gitleaks-results.sarif ]; then
            cat > gitleaks-results.sarif << 'EOF'
          {
            "version": "2.1.0",
            "runs": [{
              "tool": {"driver": {"name": "Gitleaks", "rules": []}},
              "results": []
            }]
          }
          EOF
          fi

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true  # no-op on private repos without GitHub Advanced Security
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks

      - name: Fail if leaks found
        if: steps.gitleaks.outcome == 'failure'
        run: exit 1
